{# Amount/category/date/description fields shared by add_expense.html and
   edit_expense.html. Expects: form (dict-like), categories, today. #}
<div class="form-group">
    <label for="amount">Amount</label>
    <div class="exp-amount">
        <span class="exp-currency" aria-hidden="true">₹</span>
        <input type="number" id="amount" name="amount"
               class="form-input exp-amount-input"
               step="0.01" min="0.01" inputmode="decimal"
               placeholder="0.00"
               value="{{ form.amount or '' }}"
               required autofocus>
    </div>
</div>

<div class="form-group">
    <label for="category">Category</label>
    <div class="exp-select-wrap">
        <select id="category" name="category"
                class="form-input exp-select" required>
            <option value="" disabled{% if not form.category %} selected{% endif %}>Choose a category</option>
            {% for category in categories %}
            <option value="{{ category }}"{% if category == form.category %} selected{% endif %}>{{ category }}</option>
            {% endfor %}
        </select>
    </div>
</div>

<div class="form-group">
    <label for="date">Date</label>
    <input type="date" id="date" name="date"
           class="form-input"
           max="{{ today }}"
           value="{{ form.date or '' }}"
           required>
</div>

<div class="form-group">
    <label for="description">Description <span class="exp-optional">(optional)</span></label>
    <input type="text" id="description" name="description"
           class="form-input" maxlength="200"
           placeholder="Lunch with team"
           value="{{ form.description or '' }}">
</div>
